# Global options:

[mypy]
python_version = 3.10
mypy_path = $MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/stubs
files = scale_sensor_fusion_io
plugins = numpy.typing.mypy_plugin
exclude = scripts|tests|archive

explicit_package_bases = True
namespace_packages = True

warn_unused_configs = True

allow_redefinition = True
disallow_untyped_defs = True
disallow_any_unimported = True
no_implicit_optional = True
check_untyped_defs = True
warn_return_any = True

warn_unused_ignores = True
show_error_codes = True

[mypy-scipy.spatial.transform]
ignore_missing_imports = True

[mypy-scipy.interpolate]
ignore_missing_imports = True

[mypy-scale_sensor_fusion_io.models.*]
disallow_any_unimported = False

[mypy-scale_sensor_fusion_io.models.paths.*]
ignore_errors = True

[mypy-scale_sensor_fusion_io.models.sensors.camera.*]
ignore_errors = False

[mypy-scale_sensor_fusion_io.utils.downsample]
ignore_errors = True

[mypy-scale_sensor_fusion_io.utils.pose_path_helpers]
disallow_any_unimported = False

[mypy-scale_sensor_fusion_io.validation.dacite_internal.*]
ignore_errors = True

[mypy-skvideo.io]
ignore_missing_imports = True
[mypy-skvideo]
ignore_missing_imports = True
[mypy-cv2]
ignore_missing_imports = True
[mypy-ffmpeg]
ignore_missing_imports = True
[mypy-pandas]
ignore_missing_imports = True
[mypy-turbojpeg]
ignore_missing_imports = True

[mypy-pyquaternion]
ignore_missing_imports = True